<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-9">
                <h1 class="mb-2">Cadastro de aluno</h1>
                <p class="text-secondary mb-4">
                    Exemplo de validações nativas do HTML e regras personalizadas em JavaScript.
                </p>

                <!--
                    novalidate desativa somente as mensagens automáticas do navegador.
                    As restrições continuam disponíveis pela propriedade validity.
                -->
                <form id="formAluno" class="card shadow-sm" novalidate>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="nome" class="form-label">Nome completo</label>
                                <input id="nome" class="form-control" type="text"
                                    required minlength="5" autocomplete="name">
                                <div id="erroNome" class="invalid-feedback"></div>
                            </div>

                            <div class="col-12 col-md-7">
                                <label for="email" class="form-label">E-mail institucional</label>
                                <input id="email" class="form-control" type="email"
                                    required placeholder="nome@aluno.edu.br" autocomplete="email">
                                <div id="erroEmail" class="invalid-feedback"></div>
                            </div>

                            <div class="col-12 col-md-5">
                                <label for="matricula" class="form-label">Matrícula</label>
                                <input id="matricula" class="form-control" type="text"
                                    required pattern="[0-9]{8}" maxlength="8"
                                    inputmode="numeric" placeholder="12345678">
                                <div id="erroMatricula" class="invalid-feedback"></div>
                            </div>

                            <div class="col-12 col-md-4">
                                <label for="nascimento" class="form-label">Data de nascimento</label>
                                <input id="nascimento" class="form-control" type="date" required>
                                <div id="erroNascimento" class="invalid-feedback"></div>
                            </div>

                            <div class="col-12 col-md-5">
                                <label for="curso" class="form-label">Curso</label>
                                <select id="curso" class="form-select" required>
                                    <option value="">Selecione</option>
                                    <option value="Engenharia de Software">Engenharia de Software</option>
                                    <option value="Ciência da Computação">Ciência da Computação</option>
                                    <option value="Sistemas de Informação">Sistemas de Informação</option>
                                </select>
                                <div id="erroCurso" class="invalid-feedback"></div>
                            </div>

                            <div class="col-12 col-md-3">
                                <label for="semestre" class="form-label">Semestre</label>
                                <input id="semestre" class="form-control" type="number"
                                    required min="1" max="10" step="1">
                                <div id="erroSemestre" class="invalid-feedback"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="senha" class="form-label">Senha</label>
                                <input id="senha" class="form-control" type="password"
                                    required minlength="8" autocomplete="new-password">
                                <div class="form-text">Mínimo de 8 caracteres, uma maiúscula e um número.</div>
                                <div id="erroSenha" class="invalid-feedback"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="confirmacaoSenha" class="form-label">Confirme a senha</label>
                                <input id="confirmacaoSenha" class="form-control" type="password"
                                    required autocomplete="new-password">
                                <div id="erroConfirmacaoSenha" class="invalid-feedback"></div>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input id="termos" class="form-check-input" type="checkbox" required>
                                    <label for="termos" class="form-check-label">
                                        Confirmo que os dados informados estão corretos.
                                    </label>
                                    <div id="erroTermos" class="invalid-feedback"></div>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-primary mt-4" type="submit">Cadastrar aluno</button>
                    </div>
                </form>

                <section id="painelResultado" class="mt-4 d-none">
                    <div class="alert alert-success">
                        Dados validados com sucesso. Nenhuma informação foi enviada ao servidor.
                    </div>
                    <h2 class="h4">Objeto convertido em JSON</h2>
                    <pre id="resultado" class="bg-dark text-light p-3 rounded"></pre>
                </section>
            </div>
        </div>
    </main>
</body>
</html>

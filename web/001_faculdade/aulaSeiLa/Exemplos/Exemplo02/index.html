<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM e eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-7">
                <h1 id="tituloPagina" class="mb-4">Cadastro de atividade</h1>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título</label>
                            <input id="titulo" class="form-control" type="text">
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoria</label>
                            <select id="categoria" class="form-select">
                                <option value="">Selecione</option>
                                <option value="Desenvolvimento">Desenvolvimento</option>
                                <option value="Teste">Teste</option>
                                <option value="Documentação">Documentação</option>
                            </select>
                        </div>

                        <button id="btnExibir" class="btn btn-primary" type="button">
                            Exibir dados
                        </button>
                    </div>
                </div>

                <div id="resultado" class="alert alert-info mt-4 d-none"></div>
            </div>
        </div>
    </main>
</body>
</html>

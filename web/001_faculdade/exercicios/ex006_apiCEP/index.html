<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <main>
            <form>
                <label for="cep">CEP:</label>
                <input type="text" id="cep" placeholder="Digite o CEP" />

                <button type="button" id="buscar_cep">Buscar CEP</button>

                <label for="logradouro">Logradouro:</label>
                <input type="text" id="logradouro" placeholder="Rua" readonly />

                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" placeholder="Bairro" readonly />

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Cidade" readonly />

                <label for="estado">Estado (UF):</label>
                <input type="text" id="estado" placeholder="UF" readonly />

                <label for="numero">Número:</label>
                <input type="text" id="numero" placeholder="Número" />

                <label for="complemento">Complemento:</label>
                <input type="text" id="complemento" placeholder="Complemento" />
            </form>
        </main>
    </body>
</html>
